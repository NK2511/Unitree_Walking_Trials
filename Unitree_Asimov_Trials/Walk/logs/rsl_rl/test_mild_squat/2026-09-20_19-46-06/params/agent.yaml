seed: 42
num_steps_per_env: 24
max_iterations: 10
obs_groups:
  critic: !!python/tuple
  - critic
  actor: !!python/tuple
  - policy
save_interval: 50
experiment_name: test_mild_squat
run_name: ''
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: null
class_name: OnPolicyRunner
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
actor:
  hidden_dims: !!python/tuple
  - 256
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    init_std: 0.5
    std_type: scalar
critic:
  hidden_dims: !!python/tuple
  - 256
  - 256
  - 128
  activation: elu
  obs_normalization: true
multi_gpu: null
